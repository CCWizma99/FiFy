<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiFy AI Assistant</title><link rel="stylesheet" href="./frame.css"><script src="./frame.js" defer></script></head>
<body>
<section id="panel" aria-label="FiFy AI Assistant" hidden>
  <header><div class="avatar" aria-hidden="true">✦</div><div class="identity"><h1 id="bot-title">FiFy AI Assistant</h1><span><i></i> Your fashion-search guide</span></div><button id="reset" title="Clear conversation" aria-label="Clear conversation">↺</button><button id="close" aria-label="Close assistant">×</button></header>
  <div class="demo-notice">LIVE AI DEMO <span>·</span> Please don’t share sensitive information.</div>
  <div id="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>
  <div id="suggestions" aria-label="Suggested questions">
    <button>How does visual search work?</button><button>Can I save products?</button><button>Do I need an account?</button><button>What can you help me with?</button>
  </div>
  <div id="feedback" role="status" hidden><span id="feedback-text"></span><button id="retry" hidden>Retry</button></div>
  <form id="composer"><label for="message" class="sr-only">Your message</label><textarea id="message" rows="1" maxlength="1000" placeholder="Ask me about FiFy…" required></textarea><button id="send" aria-label="Send message" type="submit">↑</button></form>
  <footer>Powered by Gemini <span>✦</span> Grounded in FiFy FAQs</footer>
</section>
<button id="launcher" aria-label="Open FiFy AI Assistant" aria-expanded="false"><span aria-hidden="true">✦</span> Ask FiFy AI <span class="launcher-dot"></span></button>
</body></html>
